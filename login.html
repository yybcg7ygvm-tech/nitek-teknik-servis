<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>NİTEK Giriş / Kayıt</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><main class="login-card">
<div id="logoBox"></div><h1>NİTEK Teknik Servis</h1><p class="muted">Hesabınla giriş yap veya yeni hesap oluştur.</p>
<div id="authForm"><label>E-posta</label><input id="email" type="email" placeholder="ornek@mail.com" autocomplete="email"><label>Şifre</label><input id="pass" type="password" placeholder="Şifre" autocomplete="current-password"><div class="actions"><button class="primary" id="loginBtn">Giriş Yap</button><button class="light" id="signupBtn">Kayıt Ol</button></div><button class="light full" id="resetBtn">Şifremi Unuttum</button><div id="authMsg" class="message"></div></div>
<div id="otpForm" class="hidden"><h3>E-posta doğrulama</h3><p class="muted">E-postana gelen doğrulama kodunu gir.</p><input id="otp" inputmode="numeric" maxlength="8" placeholder="Doğrulama kodu"><button class="primary full" id="otpBtn">Kodu Doğrula</button><button class="light full" id="backAuth">Geri</button><div id="otpMsg" class="message"></div></div>
<p class="muted" style="font-size:12px;margin-top:18px">Gerçek e-posta doğrulaması için Supabase bilgileri app-config.js dosyasına eklenebilir.</p>
</main><script src="app-config.js"></script><script src="login.js"></script></body></html>
