<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>NİTEK Giriş</title><link rel="stylesheet" href="style.css"></head><body class="login-page">
<main class="login-card"><div id="logoBox"></div><h1>NİTEK TEKNİK SERVİS</h1><p class="muted">Bulut hesabına giriş yap veya kayıt ol.</p>
<label>E-posta</label><input id="email" type="email" autocomplete="email" placeholder="ornek@mail.com">
<label>Şifre</label><input id="pass" type="password" autocomplete="current-password" placeholder="Şifre">
<div class="actions"><button class="primary" id="loginBtn">Giriş Yap</button><button class="light" id="signupBtn">Kayıt Ol</button></div>
<button class="light full" id="resetBtn">Şifremi Unuttum</button><p id="msg" class="muted"></p>
</main><script src="app-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="login-cloud.js"></script></body></html>
