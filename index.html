<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>NİTEK Teknik Servis</title>
<link rel="stylesheet" href="style.css">
<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
<div class="header-inner">
<div class="header-title"><b>NİTEK TEKNİK SERVİS</b><span>Kombi • Klima • Bakım • Onarım</span></div>
<button class="light" onclick="logout()">Çıkış</button>
</div>
</header>

<main class="container">
<div class="nav">
<button class="primary" onclick="showPage('home')">Ana Sayfa</button>
<button class="light" onclick="showPage('service')">🧾 Yeni Servis</button>
<button class="light" onclick="showPage('faults')">🔥 Arıza Kodları</button>
<button class="light" onclick="showPage('customers')">👤 Müşteriler</button>
</div>

<section id="home" class="page">
<div class="card">
<h1>Hoş geldin 👋</h1>
<p class="muted">Kullanıcı: <b id="userName"></b></p>
<div class="grid">
<button class="blue" onclick="showPage('service')">🧾 Yeni Servis</button>
<button class="blue" onclick="showPage('faults')">🔥 Arıza Kodları</button>
<button class="blue" onclick="showPage('customers')">👤 Müşteriler</button>
<button class="light" onclick="showPage('catalog')">⚙️ Marka / Model</button>
</div>
</div>
<div class="card"><h2>Özet</h2><div id="summary"></div></div>
</section>

<section id="service" class="page hidden">
<div class="card">
<h2>🧾 Yeni Servis</h2>
<label>Müşteri</label><input id="serviceCustomer" placeholder="Müşteri adı soyadı">
<label>Telefon</label><input id="servicePhone" placeholder="Telefon">
<label>Adres</label><input id="serviceAddress" placeholder="Adres">

<label>İşlem Türü</label>
<select id="serviceType" onchange="serviceTypeChanged()">
<option>Arıza</option><option>Bakım</option><option>Montaj</option><option>Diğer</option>
</select>
<label>Cihaz Türü</label>
<select id="serviceDevice" onchange="serviceBrands()">
<option>Kombi</option><option>Klima</option><option>Şofben</option><option>Diğer</option>
</select>
<label>Marka</label><select id="serviceBrand" onchange="serviceModels()"></select>
<label>Model</label><select id="serviceModel"></select>

<div id="faultBox">
<label>Müşteri Şikâyeti / Arıza</label><textarea id="serviceComplaint" placeholder="Müşterinin şikâyeti"></textarea>
</div>

<div id="maintenanceBox" class="hidden">
<h3>🛠️ Bakım Kontrolleri</h3>
<p class="muted">Sadece işaretlediğin kontroller PDF'e yazılır.</p>
<div id="maintenanceChecks"></div>
<div class="actions"><button class="light" onclick="checkAll(true)">☑️ Hepsini İşaretle</button><button class="light" onclick="checkAll(false)">⬜ Temizle</button></div>
</div>

<label>Tarih</label><input id="serviceDate" type="date">
<label>Saat</label><input id="serviceTime" type="time">
<label>Yapılan İşlem / Teknisyen Notu</label><textarea id="serviceWork"></textarea>
<label>Ücret (₺)</label><input id="servicePrice" type="number" min="0" placeholder="0">
<div class="actions"><button class="primary" onclick="saveService()">💾 Servisi Kaydet + PDF</button><button class="light" onclick="showPage('home')">Geri</button></div>
</div>
</section>

<section id="faults" class="page hidden">
<div class="card"><h2>🔥 Kombi Arıza Kodları</h2><input id="faultSearch" oninput="renderFaults()" placeholder="Kod veya açıklama ara">
<div id="faultList"></div></div>
</section>

<section id="customers" class="page hidden">
<div class="card"><h2>👤 Müşteriler</h2>
<input id="customerSearch" oninput="renderCustomers()" placeholder="Müşteri / telefon ara">
<button class="blue" onclick="newCustomer()">＋ Yeni Müşteri</button>
<div id="customerList"></div></div>
</section>

<section id="history" class="page hidden">
<div class="card"><h2>📋 Müşteri Geçmişi</h2><div id="historyTitle"></div><hr><div id="historyList"></div>
<button class="light" onclick="showPage('customers')">Geri</button></div>
</section>

<section id="catalog" class="page hidden">
<div class="card"><h2>⚙️ Marka / Model</h2>
<label>Cihaz Türü</label><select id="catalogDevice"><option>Kombi</option><option>Klima</option><option>Şofben</option><option>Diğer</option></select>
<input id="newBrand" placeholder="Yeni marka">
<input id="newModel" placeholder="Yeni model">
<button class="blue" onclick="addBrandModel()">＋ Marka / Model Ekle</button>
<p class="muted">Eklediğin marka ve modeller bu telefonda saklanır.</p>
</div></section>
</main>
<script src="app.js"></script>
</body>
</html>
