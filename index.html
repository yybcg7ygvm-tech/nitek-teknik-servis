<!doctype html><html lang=tr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#07152f"><title>NİTEK Teknik Servis</title><link rel=stylesheet href=style.css><script src=data.js></script><script src=app-config.js></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<header class=appbar><div class=bar><div class=brand><img src=logo.jpg onerror="this.style.display='none'"><div><b>NİTEK TEKNİK SERVİS</b><span>Kombi • Klima • Bakım • Onarım • Montaj</span></div></div><button class=light onclick=logout()>Çıkış</button></div></header>
<main class=wrap>
<section id=home class="page active"><div class=card><h2>🏠 Ana Sayfa</h2><div id=homeStats></div></div><div class=tiles><button class="tile blue" onclick="show('service')">🧾<strong>Yeni Servis</strong><span>Arıza • Bakım • Montaj</span></button><button class="tile blue" onclick="show('customers')">👤<strong>Müşteriler</strong><span>Geçmiş</span></button><button class="tile blue" onclick="show('services')">📋<strong>Servisler</strong><span>Kayıtlar</span></button><button class="tile blue" onclick="show('faults')">🔥<strong>Arıza Kodları</strong><span>Ara</span></button></div><div class=card><h3>Son Servisler</h3><div id=recent></div></div></section>
<section id=service class=page><div class=card><h2>🧾 Yeni Servis</h2><label>Müşteri</label><input id=customer placeholder="Ad soyad"><label>Telefon</label><input id=phone><label>Adres</label><input id=address><label>Servis Türü</label><select id=type onchange=serviceType()><option>Arıza</option><option>Bakım</option><option>Montaj</option><option>Kontrol</option><option>Diğer</option></select><label>Cihaz</label><select id=device onchange=brandList()><option>Kombi</option><option>Klima</option><option>Şofben</option><option>Kazan</option><option>Diğer</option></select><label>Marka</label><select id=brand onchange=modelList()></select><label>Model</label><select id=model></select><div id=faultBox><label>Müşteri Şikâyeti / Arıza</label><textarea id=complaint></textarea></div><div id=maintBox class=hidden><h3>🛠️ Bakım Kontrolleri</h3><div id=checks></div><div class=actions><button class=light onclick="allChecks(true)">☑️ Hepsini</button><button class=light onclick="allChecks(false)">Temizle</button></div></div><label>Tarih</label><input id=date type=date><label>Saat</label><input id=time type=time><label>Yapılan İşlem</label><textarea id=work></textarea><label>Değişen Parça / Malzeme</label><textarea id=partsText></textarea><div class=grid><div><label>İşçilik</label><input id=labor type=number min=0></div><div><label>Parça</label><input id=parts type=number min=0></div></div><label>Ödeme</label><select id=payment><option>Ödenmedi</option><option>Nakit</option><option>Kart</option><option>Havale/EFT</option></select><label>Not</label><textarea id=note></textarea><button class="primary full" onclick=saveService()>💾 Servisi Kaydet</button></div></section>
<section id=customers class=page><div class=card><h2>👤 Müşteriler</h2><input id=customerSearch oninput=customers() placeholder="Ara"><button class=blue onclick=addCustomer>＋ Yeni Müşteri</button><div id=customerList></div></div></section>
<section id=services class=page><div class=card><h2>📋 Servisler</h2><input id=serviceSearch oninput=services() placeholder="Ara"><div id=serviceList></div></div></section>
<section id=history class=page><div class=card><button class=light onclick="show('customers')">← Geri</button><div id=historyTitle></div><div id=historyList></div></div></section>
<section id=detail class=page><div id=detail></div></section>
<section id=faults class=page><div class=card><h2>🔥 Arıza Kodları</h2><input id=faultSearch oninput=faults() placeholder="Kod / açıklama ara"><div id=faultList></div></div></section>
<section id=reports class=page><div class=card><h2>📊 Raporlar</h2><div id=report></div></div></section>
</main><nav class=bottom><button data-page=home onclick="show('home')">🏠<br>Ana</button><button data-page=customers onclick="show('customers')">👥<br>Müşteri</button><button data-page=service onclick="show('service')">➕<br>Servis</button><button data-page=services onclick="show('services')">📋<br>Kayıt</button><button data-page=reports onclick="show('reports')">📊<br>Rapor</button></nav><script src=app.js></script></body></html>
